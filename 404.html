<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Creek Ocean Construction</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0a0a; --card: #1a1a1a; --accent: #c8a45e; --text: #cccccc; --muted: #888888; }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; text-align: center; }
  main { max-width: 480px; }
  .code { font-size: 0.8rem; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin-bottom: 1rem; }
  h1 { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(1.8rem, 6vw, 2.4rem); color: #fff; margin-bottom: 1rem; font-weight: 600; }
  p { color: var(--muted); line-height: 1.7; margin-bottom: 2rem; overflow-wrap: break-word; }
  a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0.8rem 1.8rem; background: var(--accent); color: var(--bg); font-weight: 600; text-decoration: none; border-radius: 6px; }
  a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="code">Error 404</p>
  <h1>Page not found</h1>
  <p>The page you are looking for does not exist or has moved.</p>
  <a href="/">Back to Creek Ocean Construction</a>
</main>
</body>
</html>
